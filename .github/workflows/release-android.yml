name: Production Release Android APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for GitHub Release (e.g. v1.0.0)'
        required: false
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Decode Production Release Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 tidak ditemukan atau kosong!"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          if [ ! -s "$RUNNER_TEMP/release.keystore" ]; then
            echo "::error::Gagal decode keystore atau ukuran file 0 bytes!"
            exit 1
          fi
          echo "Keystore berhasil di-decode ke temporary file."

      - name: Compile Kotlin Release
        run: ./gradlew --no-daemon --stacktrace :app:compileReleaseKotlin

      - name: Build Signed Release APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Cleanup Temporary Keystore File
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore"
          echo "Temporary keystore file dibersihkan."

      - name: Validate & Verify Release APK
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::File APK release tidak ditemukan di $APK_PATH!"
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          if [ "$FILE_SIZE" -le 1000000 ]; then
            echo "::error::File APK release terlalu kecil ($FILE_SIZE bytes)!"
            exit 1
          fi
          echo "Ukuran APK Release: $FILE_SIZE bytes"

          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner -type f 2>/dev/null | sort -V | tail -n 1)
          AAPT=$(find $ANDROID_HOME/build-tools -name aapt -type f 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner tidak ditemukan di Android SDK!"
            exit 1
          fi

          echo "=== MEMVERIFIKASI DIGITAL SIGNATURE DENGAN APKSIGNER ==="
          VERIFY_OUTPUT=$($APKSIGNER verify --verbose --print-certs "$APK_PATH" 2>&1)
          echo "$VERIFY_OUTPUT"

          if echo "$VERIFY_OUTPUT" | grep -q "DOES NOT VERIFY"; then
            echo "::error::Tanda tangan digital APK TIDAK VALID!"
            exit 1
          fi

          if ! echo "$VERIFY_OUTPUT" | grep -q "Verified using v2 scheme.*true"; then
            echo "::error::APK tidak memiliki tanda tangan Scheme v2 valid!"
            exit 1
          fi
          echo "Digital signature release TERVERIFIKASI VALID!"

          if [ -n "$AAPT" ]; then
            echo "=== MEMVERIFIKASI METADATA PAKET ==="
            BADGING=$($AAPT dump badging "$APK_PATH" 2>&1)
            PKG_NAME=$(echo "$BADGING" | grep -oP "package: name='\K[^']+")
            echo "Application ID: $PKG_NAME"
            if [ "$PKG_NAME" != "id.p2kd.kalisalak.coklit" ]; then
              echo "::error::Application ID salah: $PKG_NAME!"
              exit 1
            fi
          fi

          cd app/build/outputs/apk/release
          sha256sum app-release.apk > app-release.apk.sha256
          SHA256=$(cat app-release.apk.sha256 | awk '{print $1}')
          echo "SHA-256 Checksum: $SHA256"
          echo "RELEASE_SHA256=$SHA256" >> $GITHUB_ENV

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: p2kd-native-apk-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
          retention-days: 30
          if-no-files-found: error

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "$TAG" ] || [ "$TAG" = "main" ]; then
            TAG="v1.1.0"
          fi

          echo "Mempublikasikan GitHub Release untuk tag: $TAG"

          cat << EOF > release_notes.md
          ## P2KD Kalisalak — Aplikasi Coklit Pemilih Pilkades (Production Release)

          Aplikasi native Android resmi untuk Petugas Pemutakhiran Data Pemilih (Pantarlih) dan Panitia Pemilihan Kepala Desa (P2KD) Kalisalak.

          ### Informasi Rilis
          * **Versi**: 1.0.0 (\`$TAG\`)
          * **Package ID**: \`id.p2kd.kalisalak.coklit\`
          * **Status**: Production Release (Signed Digitally)
          * **Target SDK**: Android API 34 (Android 14)
          * **Minimum SDK**: Android API 24 (Android 7.0 Nougat)
          * **Digital Signature**: Keystore Resmi P2KD Kalisalak (Scheme v1 + v2 + v3)

          ### Keputusan Arsitektur Resmi
          * **1 QR CODE = 1 RUMAH = BANYAK KK = BANYAK ANGGOTA KELUARGA**
          * QR Code C6 merupakan identitas fisik rumah/bangunan, bukan identitas individu.
          * **Nama penghuni pada stiker fisik ditulis secara manual oleh petugas di lapangan menggunakan pulpen saat Coklit**, dan dicatat ke dalam sistem pada riwayat kunjungan.

          ### Verifikasi Integritas Checksum
          * **File APK**: \`app-release.apk\`
          * **SHA-256**: \`${{ env.RELEASE_SHA256 }}\`
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada, memperbarui file dan rilis..."
            gh release edit "$TAG" --title "P2KD Coklit $TAG (Production Release)" --notes-file release_notes.md
            gh release upload "$TAG" app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-release.apk.sha256 --clobber
          else
            echo "Membuat GitHub Release baru untuk tag $TAG..."
            gh release create "$TAG" \
              app/build/outputs/apk/release/app-release.apk \
              app/build/outputs/apk/release/app-release.apk.sha256 \
              --title "P2KD Coklit $TAG (Production Release)" \
              --notes-file release_notes.md
          fi

          echo "GitHub Release berhasil dipublikasikan!"
